[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm"
version = "2.0.0"
description = "A small GPT-style causal language model built from scratch in PyTorch, with a FastAPI + web chat UI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tiny-llm-prepare-data = "tiny_llm.prepare_data:main"
tiny-llm-train = "tiny_llm.train:main"
tiny-llm-train-sft = "tiny_llm.train_sft:main"
tiny-llm-generate = "tiny_llm.generate:main"
tiny-llm-evaluate = "tiny_llm.evaluate_sft:main"
tiny-llm-serve = "api.serve:main"

[tool.setuptools]
packages = ["tiny_llm", "api"]

[tool.setuptools.package-dir]
tiny_llm = "src/tiny_llm"
api = "api"
